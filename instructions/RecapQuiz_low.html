{% block title %}
    <h3> Quiz about the instructions </h3>
{% endblock %}

{% block content %}
<br>

<b>10. The Realized Project Value of a project is determined by the Expected Project Value plus the Noise Term.</b>
<p id="feedback"></p>

<!-- Quiz options -->
<input type="radio" name="question10" value="1">
The Noise Term ranges between [-50; +50].<br>

<input type="radio" name="question10" value="2">
The Noise Term ranges between [-150; +150].<br>

<br><br>

<!-- Next button initially disabled -->
<button id="submit-btn" type="button" class="btn btn-primary" onclick="submitAnswer()">
    Submit
</button>

<button id="next-btn" type="button" class="btn btn-primary" style="display:none;" onclick="document.querySelector('form').submit()">
    Next
</button>

<!-- JavaScript for immediate feedback and enabling Next -->
<script>
    function submitAnswer() {
        const radios = document.querySelectorAll('input[name="question10"]');
        let selectedValue = null;
        radios.forEach(r => { if (r.checked) selectedValue = parseInt(r.value); });

        if (selectedValue === null) {
            document.getElementById('feedback').innerHTML =
                '⚠️ Please select an answer before submitting.';
            document.getElementById('feedback').style.color = 'darkorange';
            return;
        }

        // disable submit, show feedback
        document.getElementById('submit-btn').disabled = true;
        checkAnswer(selectedValue);
    }

    function checkAnswer(selectedValue) {
        const feedback = document.getElementById("feedback");
        const nextBtn = document.getElementById("next-btn");

        if (selectedValue === 1) {
            feedback.innerHTML = "✅ Correct! The Noise Term is randomly determined and ranges between [-50; +50].";
            feedback.style.color = "darkgreen";
            nextBtn.style.display = "";   // Show Next
            document.getElementById('submit-btn').style.display = 'none'; // Hide Submit
        } else {
            feedback.innerHTML = "❌ Incorrect. The Noise Term is randomly determined and ranges between [-50; +50].";
            feedback.style.color = "darkred";
            nextBtn.style.display = 'none';  // Keep Next hidden
            document.getElementById('submit-btn').disabled = false; // allow re-submit
        }
    }
</script>

{% endblock %}
